<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Stylized Barbell Icon -->
  <g filter="url(#neonGlow)">
    <!-- Central Bar -->
    <rect x="96" y="244" width="320" height="24" rx="12" fill="#ffffff" opacity="0.9" />

    <!-- Left Outer Collar -->
    <rect x="136" y="196" width="16" height="120" rx="6" fill="url(#glowGrad)" />
    <!-- Left Plate Large -->
    <rect x="156" y="146" width="28" height="220" rx="10" fill="url(#glowGrad)" />
    <!-- Left Plate Small -->
    <rect x="188" y="176" width="22" height="160" rx="8" fill="url(#glowGrad)" opacity="0.85" />

    <!-- Right Plate Small -->
    <rect x="302" y="176" width="22" height="160" rx="8" fill="url(#glowGrad)" opacity="0.85" />
    <!-- Right Plate Large -->
    <rect x="328" y="146" width="28" height="220" rx="10" fill="url(#glowGrad)" />
    <!-- Right Outer Collar -->
    <rect x="360" y="196" width="16" height="120" rx="6" fill="url(#glowGrad)" />

    <!-- Grip Knurling Center -->
    <rect x="236" y="240" width="40" height="32" rx="4" fill="url(#glowGrad)" opacity="0.9" />
  </g>

  <!-- Bottom Lightning bolt accent -->
  <path d="M256 390 L242 414 L256 414 L246 438 L270 410 L256 410 Z" fill="#10b981" />
</svg>
